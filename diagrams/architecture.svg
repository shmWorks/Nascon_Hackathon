<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a1c1c"/></marker>
    <style>
      .t{font-weight:700;font-size:15px} .s{fill:#555;font-size:11.5px} .lane{fill:#f7f5ef;stroke:#bdb6a4;stroke-width:1.2}
      .box{fill:#fff;stroke:#333;stroke-width:1.3;rx:6} .ext{fill:#eef3fb;stroke:#3a5f9a;stroke-width:1.3}
      .gw{fill:#fff4e5;stroke:#b26a00;stroke-width:1.3} .db{fill:#eef7ef;stroke:#2f6b3a;stroke-width:1.3}
      .ci{fill:#f3eefa;stroke:#5b3f8f;stroke-width:1.3} .f{stroke:#333;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .l{stroke:#8a1c1c;stroke-width:2;fill:none;marker-end:url(#b)} .d{stroke:#999;stroke-width:1.2;fill:none;stroke-dasharray:5 4;marker-end:url(#a)}
      .n{fill:#141414;font-weight:700;font-size:12px} .nc{fill:#ffd84d;stroke:#141414}
    </style>
  </defs>
  <rect width="1600" height="1040" fill="#fffdf8"/>
  <text x="30" y="40" font-size="24" font-weight="700">Morning Paper — system architecture</text>
  <text x="30" y="62" class="s">Personal daily newspaper: shared daily pipeline, per-reader edition build, verified synthesis, learning from reading behaviour. Numbers = main data flow.</text>

  <!-- Reader + browser -->
  <rect x="30" y="100" width="230" height="380" class="lane"/>
  <text x="45" y="124" class="t">Reader (browser)</text>
  <circle cx="145" cy="165" r="16" fill="#fff" stroke="#333" stroke-width="1.3"/><path d="M120,215 q25,-35 50,0" fill="#fff" stroke="#333" stroke-width="1.3"/>
  <rect x="50" y="235" width="190" height="52" class="box"/><text x="62" y="257" font-weight="600">Onboarding</text><text x="62" y="275" class="s">topic chips + own words</text>
  <rect x="50" y="297" width="190" height="52" class="box"/><text x="62" y="319" font-weight="600">Edition (web)</text><text x="62" y="337" class="s">read, skip, more/less, save</text>
  <rect x="50" y="359" width="190" height="52" class="box"/><text x="62" y="381" font-weight="600">Archive · PDF · Profile</text><text x="62" y="399" class="s">past papers, "what it learned"</text>
  <rect x="50" y="421" width="190" height="44" class="box"/><text x="62" y="441" font-weight="600">Event beacon</text><text x="62" y="457" class="s">seen (50%·1s), dwell, actions</text>

  <!-- Web app -->
  <rect x="300" y="100" width="260" height="380" class="lane"/>
  <text x="315" y="124" class="t">Web app (FastAPI)</text>
  <rect x="320" y="140" width="220" height="56" class="box"/><text x="332" y="162" font-weight="600">Auth &amp; sessions</text><text x="332" y="180" class="s">argon2id · SameSite cookie · Origin</text>
  <rect x="320" y="206" width="220" height="56" class="box"/><text x="332" y="228" font-weight="600">Pages (Jinja)</text><text x="332" y="246" class="s">one template → web and PDF</text>
  <rect x="320" y="272" width="220" height="56" class="box"/><text x="332" y="294" font-weight="600">Event API</text><text x="332" y="312" class="s">append-only, per reader</text>
  <rect x="320" y="338" width="220" height="62" class="box"/><text x="332" y="360" font-weight="600">On-demand scheduler</text><text x="332" y="378" class="s">first visit after 06:00 PKT: ingest</text><text x="332" y="393" class="s">day + build missing editions</text>
  <rect x="320" y="410" width="220" height="56" class="box"/><text x="332" y="432" font-weight="600">Profile = fold(events)</text><text x="332" y="450" class="s">Beta posteriors per topic/source</text>

  <!-- Pipeline -->
  <rect x="600" y="100" width="640" height="150" class="lane"/>
  <text x="615" y="124" class="t">Shared daily stages (once per edition day, all readers)</text>
  <rect x="620" y="140" width="180" height="90" class="box"/><text x="632" y="164" font-weight="600">Ingest</text><text x="632" y="183" class="s">GKG every 3 h + RSS</text><text x="632" y="199" class="s">window [D−1 06:00, D 06:00)</text><text x="632" y="215" class="s">canonical URLs, dedupe</text>
  <rect x="830" y="140" width="180" height="90" class="box"/><text x="842" y="164" font-weight="600">Allowlist</text><text x="842" y="183" class="s">catalog domains + frequent</text><text x="842" y="199" class="s">GKG publishers</text><text x="842" y="215" class="s">deterministic gate</text>
  <rect x="1040" y="140" width="180" height="90" class="box"/><text x="1052" y="164" font-weight="600">Embed (local)</text><text x="1052" y="183" class="s">model2vec, no API quota</text><text x="1052" y="199" class="s">items, IPTC topics and</text><text x="1052" y="215" class="s">free-text interests</text>
  <path d="M800,185 H828" class="f"/><path d="M1010,185 H1038" class="f"/>

  <rect x="600" y="270" width="640" height="210" class="lane"/>
  <text x="615" y="294" class="t">Per-reader edition build (idempotent, resumable)</text>
  <rect x="620" y="310" width="140" height="70" class="box"/><text x="630" y="332" font-weight="600">Rank</text><text x="630" y="350" class="s">posterior × relevance</text><text x="630" y="365" class="s">rank (model-agnostic)</text>
  <rect x="775" y="310" width="140" height="70" class="box"/><text x="785" y="332" font-weight="600">Cluster + select</text><text x="785" y="350" class="s">same-event stories,</text><text x="785" y="365" class="s">2 exploring slots</text>
  <rect x="930" y="310" width="140" height="70" class="box"/><text x="940" y="332" font-weight="600">Retrieve text</text><text x="940" y="350" class="s">feed→direct→Jina→</text><text x="940" y="365" class="s">Wayback; title check</text>
  <rect x="1085" y="310" width="140" height="70" class="box"/><text x="1095" y="332" font-weight="600">Synthesize</text><text x="1095" y="350" class="s">one call per story,</text><text x="1095" y="365" class="s">text + image, quotes</text>
  <rect x="1085" y="395" width="140" height="70" class="box" style="stroke:#8a1c1c;stroke-width:2"/><text x="1095" y="417" font-weight="600" fill="#8a1c1c">Verify in code</text><text x="1095" y="435" class="s">quote must exist in</text><text x="1095" y="450" class="s">cited source, else drop</text>
  <rect x="775" y="395" width="275" height="70" class="box"/><text x="785" y="417" font-weight="600">Commit edition (immutable) + render</text><text x="785" y="435" class="s">lead + sections by interest, "Three things",</text><text x="785" y="450" class="s">why-this-story; PDF via Chromium</text>
  <path d="M760,345 H773" class="f"/><path d="M915,345 H928" class="f"/><path d="M1070,345 H1083" class="f"/><path d="M1155,380 V393" class="f"/><path d="M1085,430 H1052" class="f"/>

  <!-- Gateways -->
  <rect x="600" y="510" width="640" height="110" class="lane"/>
  <text x="615" y="534" class="t">Choke points: every external effect passes through one gateway</text>
  <rect x="620" y="548" width="300" height="60" class="gw"/><text x="632" y="570" font-weight="600">Fetch gateway</text><text x="632" y="588" class="s">honest UA · robots.txt · timeouts · pacing · cache</text>
  <rect x="930" y="548" width="290" height="60" class="gw"/><text x="942" y="570" font-weight="600">LLM gateway</text><text x="942" y="588" class="s">input-hash cache · error-class retry · retryDelay ·</text><text x="942" y="602" class="s">per-model fallback · media guard · concurrency cap</text>

  <!-- External -->
  <rect x="1280" y="100" width="290" height="520" class="lane"/>
  <text x="1295" y="124" class="t">External services</text>
  <rect x="1300" y="140" width="250" height="60" class="ext"/><text x="1312" y="162" font-weight="600">GDELT GKG raw files</text><text x="1312" y="180" class="s">whole web, any past day, no API throttle</text>
  <rect x="1300" y="210" width="250" height="52" class="ext"/><text x="1312" y="232" font-weight="600">Publisher RSS catalog</text><text x="1312" y="250" class="s">niche depth, feed full text</text>
  <rect x="1300" y="310" width="250" height="70" class="ext"/><text x="1312" y="332" font-weight="600">Publisher sites · Jina Reader</text><text x="1312" y="350" class="s">· Wayback Machine</text><text x="1312" y="366" class="s">article text for selected stories</text>
  <rect x="1300" y="400" width="250" height="80" class="ext"/><text x="1312" y="422" font-weight="600">Gemini API (free tier)</text><text x="1312" y="440" class="s">3.5/3.1 Flash-Lite, 3.7/3.8 Flash,</text><text x="1312" y="456" class="s">Gemma 4 — budgets per model</text><text x="1312" y="471" class="s">only public news text is sent</text>

  <!-- Storage -->
  <rect x="30" y="660" width="1210" height="170" class="lane"/>
  <text x="45" y="822" class="t">State (source of truth on disk)</text>
  <path d="M70,705 v80 a120,14 0 0 0 240,0 v-80" class="db"/><ellipse cx="190" cy="705" rx="120" ry="14" class="db"/>
  <text x="95" y="740" font-weight="600">SQLite</text><text x="95" y="758" class="s">readers · sessions · events (append-only)</text><text x="95" y="774" class="s">items · topics · editions (immutable)</text>
  <path d="M370,705 v80 a120,14 0 0 0 240,0 v-80" class="db"/><ellipse cx="490" cy="705" rx="120" ry="14" class="db"/>
  <text x="395" y="740" font-weight="600">Content-addressed cache</text><text x="395" y="758" class="s">raw files, pages, model outputs</text><text x="395" y="774" class="s">no external call is paid twice</text>
  <path d="M670,705 v80 a120,14 0 0 0 240,0 v-80" class="db"/><ellipse cx="790" cy="705" rx="120" ry="14" class="db"/>
  <text x="695" y="740" font-weight="600">Edition PDFs</text><text x="695" y="758" class="s">rendered once at commit;</text><text x="695" y="774" class="s">browser "Save as PDF" fallback</text>
  <rect x="960" y="700" width="260" height="110" class="box"/><text x="972" y="722" font-weight="600">Persona simulator (eval)</text><text x="972" y="740" class="s">known true interests → simulated</text><text x="972" y="756" class="s">reading on backfilled days;</text><text x="972" y="772" class="s">nDCG@10 vs onboarding-only,</text><text x="972" y="788" class="s">recency, random (A10)</text>

  <!-- CI/CD -->
  <rect x="1280" y="660" width="290" height="340" class="lane"/>
  <text x="1295" y="684" class="t">Delivery: CI/CD</text>
  <rect x="1300" y="700" width="250" height="48" class="ci"/><text x="1312" y="722" font-weight="600">GitHub repo + PRs</text><text x="1312" y="738" class="s">every change via PR, monitored commits</text>
  <rect x="1300" y="768" width="250" height="56" class="ci"/><text x="1312" y="790" font-weight="600">GitHub Actions</text><text x="1312" y="808" class="s">ruff + pytest (offline, no keys)</text>
  <rect x="1300" y="844" width="250" height="56" class="ci"/><text x="1312" y="866" font-weight="600">Render deploy hook</text><text x="1312" y="884" class="s">only after green tests on main</text>
  <rect x="1300" y="920" width="250" height="64" class="ci"/><text x="1312" y="942" font-weight="600">Docker web service</text><text x="1312" y="960" class="s">model baked in · demo data shipped</text><text x="1312" y="975" class="s">(3 personas × 7 days)</text>
  <path d="M1425,748 V766" class="f"/><path d="M1425,824 V842" class="f"/><path d="M1425,900 V918" class="f"/>

  <!-- Main flows -->
  <path d="M240,261 H318" class="f"/>
  <path d="M540,369 H598 V185 H618" class="f"/>
  <path d="M1300,170 H1265 V92 H710 V138" class="d"/>
  <path d="M1300,236 H1258 V94" class="d"/>
  <path d="M1130,230 V258 H608 V345 H618" class="f"/>
  <path d="M1062,380 V490 H860 V546" class="d"/>
  <path d="M1220,578 H1270 V440 H1298" class="d"/>
  <path d="M770,608 V632 H1262 V345 H1298" class="d"/>
  <path d="M1225,345 H1240 V546" class="d"/>
  <path d="M900,465 V645 H300 V694" class="f"/>
  <path d="M790,465 V690" class="f"/>
  <path d="M320,234 H240 V323" class="f"/>
  <path d="M240,443 H280 V300 H318" class="l"/>
  <path d="M540,300 H575 V652 H230 V690" class="l"/>
  <path d="M320,438 H290 V600 H600 V345 H618" class="l"/>

  <!-- numbers -->
  <g><circle cx="282" cy="261" r="10" class="nc"/><text x="278" y="265" class="n">1</text></g>
  <g><circle cx="585" cy="250" r="10" class="nc"/><text x="581" y="254" class="n">2</text></g>
  <g><circle cx="1000" cy="92" r="10" class="nc"/><text x="996" y="96" class="n">3</text></g>
  <g><circle cx="608" cy="300" r="10" class="nc"/><text x="604" y="304" class="n">4</text></g>
  <g><circle cx="1255" cy="345" r="10" class="nc"/><text x="1251" y="349" class="n">5</text></g>
  <g><circle cx="1175" cy="388" r="10" class="nc"/><text x="1171" y="392" class="n">6</text></g>
  <g><circle cx="900" cy="645" r="10" class="nc"/><text x="896" y="649" class="n">7</text></g>
  <g><circle cx="280" cy="300" r="10" class="nc"/><text x="276" y="304" class="n">8</text></g>
  <g><circle cx="600" cy="470" r="10" class="nc"/><text x="596" y="474" class="n">9</text></g>

  <!-- legend -->
  <rect x="30" y="860" width="1210" height="140" fill="#fff" stroke="#bdb6a4"/>
  <text x="45" y="884" class="t">Flow</text>
  <text x="45" y="906" class="s">1 Reader signs up and onboards (topics + own words).  2 First visit of the day triggers shared stages for that edition day.  3 GKG + RSS ingested, gated, embedded locally.</text>
  <text x="45" y="924" class="s">4 Each reader's profile ranks the day's items; same-event items cluster into stories; exploring slots test new interests.  5 Article text fetched through the generic retrieval chain.</text>
  <text x="45" y="942" class="s">6 One model call per story reasons across all sources; code keeps only claims whose verbatim quote is in the cited source.  7 Edition committed, rendered to web + PDF.</text>
  <text x="45" y="960" class="s">8 Reading produces events (seen, dwell, click, skip, more/less, save).  9 Profile is re-folded from events → next edition reflects what the reader actually engaged with.</text>
  <line x1="45" y1="980" x2="85" y2="980" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><text x="92" y="984" class="s">data / control flow</text>
  <line x1="240" y1="980" x2="280" y2="980" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="287" y="984" class="s">external call via gateway</text>
  <line x1="470" y1="980" x2="510" y2="980" stroke="#8a1c1c" stroke-width="2" marker-end="url(#b)"/><text x="517" y="984" class="s">learning loop</text>
</svg>
