[project]
name = "morning-paper"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.143.3",
    "feedparser>=6.0.14",
    "google-genai>=2.31.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "numpy>=2.5.4",
    "playwright>=1.64.0",
    "python-dotenv>=1.2.4",
    "trafilatura>=2.3.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
[tool.ruff]
line-length = 160
extend-exclude = ["spikes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
